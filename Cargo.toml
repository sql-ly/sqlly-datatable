[workspace]
members = [
    "crates/sqlly-datatable",
    "crates/sqlly-datatable-sample",
]
resolver = "2"

[workspace.package]
version = "4.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.96.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
# `pedantic` is intentionally NOT enabled as a workspace-level lint. Surface
# nitpicks via `cargo clippy --workspace --all-targets -- -W clippy::pedantic`
# when cleaning up an area, but don't block the build on it.

# Registry releases: `gpui` 0.2 and `gpui-component` 0.5 now ship compatible
# crates.io versions (the 4.0.x git pins resolved to gpui 0.2.2 /
# gpui-component 0.5.x, i.e. the same lines), which restores `cargo package`
# / `cargo publish` — crates.io rejects git dependencies. The registry `gpui`
# bundles the OS windowing backends directly (`gpui::Application`), so the
# zed-main-only `gpui_platform` shim is gone; it has no registry release. The
# sample's experimental web (wasm) build went with it — gpui's web backend
# exists only on zed's git `main`. Reinstate from git history if/when a gpui
# release ships the web backend.
[workspace.dependencies]
gpui = "0.2"
gpui-component = "0.5"
# Lucide icon SVGs for `gpui_component::Icon`, embedded in the binary.
gpui-component-assets = "0.5"

# The source is ported to the zed git gpui API (Anchor, focus(window, cx),
# TextAlign paint — see the v4.1.1 port commit), which registry gpui 0.2.2
# does not ship yet. Mirror the SQLLY workspace's patches so this repo builds
# and tests standalone; deliberately rev-less because gpui-component's own
# gpui dependency is declared without a rev and patch sources must be
# textually identical to unify — the build is pinned by Cargo.lock instead
# (same revs as the SQLLY client lockfile). This root manifest is not
# packaged, so `cargo publish` of the member crate is unaffected; a crates.io
# release stays blocked until gpui ships the git API in a registry version.
[patch.crates-io]
# `version` disambiguates: the zed tree also carries a 0.0.0 `gpui` fixture.
gpui = { git = "https://github.com/zed-industries/zed", version = "=0.2.2" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
