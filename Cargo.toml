[workspace]
members = [
    "crates/sqlly-datatable",
    "crates/sqlly-datatable-sample",
]
resolver = "2"

[workspace.package]
version = "6.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.96.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
# `pedantic` is intentionally NOT enabled as a workspace-level lint. Surface
# nitpicks via `cargo clippy --workspace --all-targets -- -W clippy::pedantic`
# when cleaning up an area, but don't block the build on it.

# GPUI Kit (the renamed/reorganized longbridge/gpui-component distribution):
# `gpui-component` 0.6.x on crates.io builds against `gpui-pre` 0.3.x — a
# registry publication of the zed git `main` gpui API (the API this source
# was already ported to: Anchor, focus(window, cx), TextAlign paint). The
# rename trick (`gpui = { package = "gpui-pre" }`) keeps our code importing
# `gpui::…` unchanged while the whole graph unifies on gpui-pre. Everything
# now resolves from the registry — no [patch.crates-io] section — which also
# restores `cargo package` / `cargo publish` for the member crate. Icon SVGs
# moved from the retired `gpui-component-assets` (last release 0.5.1) to
# `gpui-kit-assets`.
[workspace.dependencies]
gpui = { package = "gpui-pre", version = "0.3.5" }
gpui-component = "0.6.4"
# Lucide icon SVGs for `gpui_component::Icon`, embedded in the binary.
gpui-kit-assets = "0.6.4"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
