[package]
name = "sqlly-datatable-sample"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sample application demonstrating the sqlly-datatable virtualized grid."
repository = "https://github.com/mattvanhorn/sqlly-datatable"
publish = false

[[bin]]
name = "sqlly-datatable-sample"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]

[lints.clippy]
expect_used = "allow"

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui-kit-assets = { workspace = true }
# Platform facade: the gpui-pre line splits the OS windowing backends into
# per-platform crates behind `gpui_platform::application()`. The x11/wayland/
# font-kit/runtime_shaders features route to the per-OS backend crates and
# are no-ops elsewhere. `gpui-pre-platform` is the registry publication of
# that facade, matching workspace `gpui` (= gpui-pre).
gpui_platform = { package = "gpui-pre-platform", version = "0.3.5", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
sqlly-datatable = { version = "6.0.0", path = "../sqlly-datatable" }
